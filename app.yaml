runtime: go126

env_variables:
  GIN_MODE: release
  GOOGLE_REDIRECT_URL: "https://goreadapp.com/auth/callback"
  STAGING_REDIRECT_URL: "https://staging-dot-goread-467200.uc.r.appspot.com/auth/callback"
  GOOGLE_CLOUD_PROJECT: "goread-467200"
  SECRET_CLIENT_ID_NAME: "google-client-id"
  SECRET_CLIENT_SECRET_NAME: "google-client-secret"
  SUBSCRIPTION_ENABLED: "true"

inbound_services:
- warmup

beta_settings:
  cloud_sql_instances: []

handlers:
# Templates reference CSS and JS with a ?v= content hash (internal/assets),
# so a changed file always gets a new URL and these can be cached for a year.
# The go126 runtime always lets the app read static files, which it needs to
# compute the hashes.
- url: /static/(.*\.(css|js))$
  static_files: web/static/\1
  upload: web/static/.*\.(css|js)$
  expiration: 365d
  secure: always

- url: /static
  static_dir: web/static
  secure: always

- url: /.*
  script: auto
  secure: always

instance_class: F1  # 256MB RAM - sufficient for RSS reader, half the cost of F2

automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.65  # Scale up when CPU > 65% (vs default ~60%)
