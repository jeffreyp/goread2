indexes:

# Index for batch URL duplicate check (projection query with time cutoff)
# Used in: FilterExistingArticleURLs(feedID, urls)
# Query: Article.FilterField("feed_id", "=", feedID).FilterField("created_at", ">=", cutoff).Project("url")
- kind: Article
  properties:
  - name: feed_id
  - name: created_at
  - name: url

# Index for getting articles by feed_id ordered by published_at descending
# Used in: GetArticles(feedID) and GetUserFeedArticles(userID, feedID)
# Query: Article.FilterField("feed_id", "=", feedID).Order("-published_at")
- kind: Article
  properties:
  - name: feed_id
  - name: published_at
    direction: desc

# Index for UserFeed queries with multiple filters
# Used in: SubscribeUserToFeed() and GetUserFeedArticles() subscription check
# Query: UserFeed.FilterField("user_id", "=", userID).FilterField("feed_id", "=", feedID)
- kind: UserFeed
  properties:
  - name: user_id
  - name: feed_id

# Indexes for audit log queries filtered by user, newest first
# Used in: GetAuditLogs(filters) from the admin audit-log endpoint and the GDPR data export
# Query: AuditLog.FilterField("target_user_id" | "admin_user_id", "=", userID).Order("-timestamp")
- kind: AuditLog
  properties:
  - name: target_user_id
  - name: timestamp
    direction: desc

- kind: AuditLog
  properties:
  - name: admin_user_id
  - name: timestamp
    direction: desc
